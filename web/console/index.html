<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>開發管理台</title>
<meta name="theme-color" content="#4338CA">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../workbench/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/* ===== 設計系統：中性灰＋單一主色；所有元件共用同一組 token ===== */
:root {
  --bg: #f6f6f8; --panel: #ffffff; --side: #fbfbfc; --canvas: #f8f8fa;
  --ink: #18181b; --sub: #52525b; --faint: #8e8e98; --line: #e6e6eb; --line-strong: #d4d4dc;
  --hover: #f1f1f5; --sel: #eef0ff;
  --accent: #4f46e5; --accent-ink: #ffffff; --accent-soft: #eef0ff; --accent-line: #c7c9fb;
  --ok: #16a34a; --ok-soft: #e9f8ee; --warn: #c2770c; --warn-soft: #fff5e0; --bad: #dc2626; --bad-soft: #fdecec; --info: #2563eb; --info-soft: #e8f0ff; --violet: #7c3aed; --violet-soft: #f3edff;
  --dot: #dcdce3;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
  --r: 10px; --r-lg: 14px;
  --shadow: 0 1px 2px rgb(16 16 30 / .04); --shadow-lg: 0 10px 40px rgb(16 16 30 / .14);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e0e11; --panel: #17171b; --side: #131317; --canvas: #121216;
  --ink: #f2f2f5; --sub: #b4b4be; --faint: #7b7b87; --line: #27272e; --line-strong: #34343d;
  --hover: #1f1f25; --sel: #23234a;
  --accent: #8b8cf8; --accent-ink: #0e0e11; --accent-soft: #22224a; --accent-line: #3d3d80;
  --ok: #4ade80; --ok-soft: #13291b; --warn: #fbbf24; --warn-soft: #2e2410; --bad: #f87171; --bad-soft: #321818; --info: #60a5fa; --info-soft: #14233d; --violet: #a78bfa; --violet-soft: #251d3d;
  --dot: #26262d; --shadow: none; --shadow-lg: 0 10px 40px rgb(0 0 0 / .5);
} }
:root[data-theme="dark"] {
  --bg: #0e0e11; --panel: #17171b; --side: #131317; --canvas: #121216;
  --ink: #f2f2f5; --sub: #b4b4be; --faint: #7b7b87; --line: #27272e; --line-strong: #34343d;
  --hover: #1f1f25; --sel: #23234a;
  --accent: #8b8cf8; --accent-ink: #0e0e11; --accent-soft: #22224a; --accent-line: #3d3d80;
  --ok: #4ade80; --ok-soft: #13291b; --warn: #fbbf24; --warn-soft: #2e2410; --bad: #f87171; --bad-soft: #321818; --info: #60a5fa; --info-soft: #14233d; --violet: #a78bfa; --violet-soft: #251d3d;
  --dot: #26262d; --shadow: none; --shadow-lg: 0 10px 40px rgb(0 0 0 / .5);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 var(--font); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
.ico { flex: none; vertical-align: middle; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ===== 版面 ===== */
.app { display: grid; grid-template-columns: 236px 1fr; grid-template-rows: 52px 1fr; height: 100vh; height: 100dvh; }
.top { grid-column: 1 / -1; position: relative; z-index: 40; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 14px; white-space: nowrap; padding-right: 6px; }
.brand img { width: 24px; height: 24px; }
.proj { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--side); cursor: pointer; min-width: 0; max-width: 360px; font-weight: 600; font-size: 13px; }
.proj:hover { border-color: var(--line-strong); }
.proj .pdot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); flex: none; }
.proj b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.proj .repo { color: var(--faint); font-weight: 500; font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }
.spacer { flex: 1; }
.fresh { color: var(--faint); font-size: 12px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.ibtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 32px; height: 32px; padding: 0 8px; border: 1px solid transparent; border-radius: 8px; background: none; cursor: pointer; color: var(--sub); white-space: nowrap; text-decoration: none; }
.ibtn:hover { background: var(--hover); color: var(--ink); text-decoration: none; }
.ibtn.outline { border-color: var(--line); color: var(--ink); }
.menu-btn { display: none; }
.who { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; color: var(--ink); } .who img { width: 22px; height: 22px; border-radius: 50%; }

/* ===== 側欄 ===== */
.side { background: var(--side); border-right: 1px solid var(--line); overflow-y: auto; padding: 8px 10px 24px; }
.side h6 { margin: 16px 10px 6px; font-size: 11px; letter-spacing: .04em; color: var(--faint); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.nav { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: none; cursor: pointer; text-align: left; color: var(--sub); font-weight: 500; font-size: 13.5px; text-decoration: none; }
.nav:hover { background: var(--hover); color: var(--ink); text-decoration: none; }
.nav[aria-current="page"] { background: var(--sel); color: var(--accent); font-weight: 600; }
.nav[aria-current="page"]::before { content: ""; position: absolute; left: -10px; top: 7px; bottom: 7px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.nav .n { margin-left: auto; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.nav .n.hot { color: #fff; background: var(--bad); border-radius: 999px; padding: 0 7px; line-height: 18px; }
.nav .ext { margin-left: auto; color: var(--faint); }

/* ===== 主區、明細 ===== */
.main { overflow: hidden; display: flex; min-width: 0; }
.view { flex: 1; overflow-y: auto; padding: 22px 28px 48px; min-width: 0; }
.detail { width: min(46%, 600px); border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 20px 24px 48px; display: none; }
.detail.open { display: block; }
.vh { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.vh h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.vh h1 .ico { color: var(--faint); }
.vh .sub { color: var(--faint); font-size: 13px; }
.crumb { color: var(--faint); font-size: 12px; margin-bottom: 4px; display: flex; gap: 6px; align-items: center; }
h3 { font-size: 13px; font-weight: 600; margin: 0 0 10px; color: var(--sub); display: flex; align-items: center; gap: 7px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px; box-shadow: var(--shadow); }
.card + .card { margin-top: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 14px; margin-top: 14px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; cursor: default; }
.kpi[data-go] { cursor: pointer; } .kpi[data-go]:hover { border-color: var(--line-strong); }
.kpi .k { display: flex; align-items: center; gap: 7px; color: var(--faint); font-size: 12.5px; font-weight: 500; }
.kpi b { font-size: 26px; font-weight: 650; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.muted { color: var(--faint); font-size: 12.5px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--hover); color: var(--sub); border: 0; }
button.chip { cursor: pointer; } button.chip:hover { filter: brightness(.97); }
.s-待同意 { background: var(--warn-soft); color: var(--warn); }
.s-已同意 { background: var(--info-soft); color: var(--info); }
.s-實作中 { background: var(--accent-soft); color: var(--accent); }
.s-待結案 { background: var(--violet-soft); color: var(--violet); }
.s-已結案 { background: var(--ok-soft); color: var(--ok); }
.c-bad { background: var(--bad-soft); color: var(--bad); } .c-ok { background: var(--ok-soft); color: var(--ok); } .c-warn { background: var(--warn-soft); color: var(--warn); }
.bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; min-width: 70px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); text-decoration: none; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--hover); text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); } .btn.primary:hover { filter: brightness(1.06); }
.btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn[disabled] { opacity: .6; cursor: progress; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 2px; background: var(--side); }
.seg button { border: 0; background: none; height: 28px; padding: 0 12px; border-radius: 7px; cursor: pointer; color: var(--sub); font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.search { width: 100%; max-width: 300px; height: 34px; padding: 0 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; }

/* 表格 */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); }
table.t { width: 100%; border-collapse: collapse; }
.t th { text-align: left; font-size: 12px; color: var(--faint); font-weight: 600; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--side); }
.t td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.t tr:last-child td { border-bottom: 0; }
.t th, .t td { min-width: 4.5em; }
.t tr.click { cursor: pointer; } .t tr.click:hover td { background: var(--hover); } .t tr.sel td { background: var(--sel); }

/* 清單 */
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); align-items: center; }
.list li:first-child { border-top: 0; padding-top: 2px; }
.list .g { flex: 1; min-width: 0; }
.list .t1 { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--warn); }
.status-dot.ok { background: var(--ok); } .status-dot.bad { background: var(--bad); } .status-dot.info { background: var(--accent); }
.empty { color: var(--faint); padding: 18px 0; text-align: center; font-size: 13px; }

/* ===== 流程圖（泳道） ===== */
.flow-wrap { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-lg); background-color: var(--canvas); background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 16px 16px; }
.flow { position: relative; display: grid; grid-template-columns: 148px repeat(8, minmax(118px, 1fr)); min-width: 1140px; padding: 18px 18px 26px; }
.flow .col-line { grid-row: 1 / -1; border-left: 1px dashed var(--line-strong); justify-self: start; width: 0; margin-left: -6px; opacity: .7; }
.flow .head { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0 18px; z-index: 1; }
.flow .num { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--ink); color: var(--panel); font-weight: 700; font-size: 13px; }
.flow .head b { font-size: 13px; font-weight: 600; }
.flow .head small { color: var(--faint); font-size: 11px; font-family: var(--mono); }
.lane-label { display: flex; align-items: center; z-index: 1; padding-right: 10px; }
.pill { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; height: 40px; padding: 0 14px; border-radius: 12px; font-weight: 600; font-size: 13px; color: #fff; background: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; border: 0; }
.pill.brand { background: linear-gradient(135deg, #4338ca, #7c3aed); }
.pill.change { background: var(--panel); color: var(--ink); border: 1px solid var(--line); height: auto; min-height: 40px; padding: 6px 12px; white-space: normal; flex-direction: column; align-items: flex-start; gap: 2px; cursor: pointer; text-align: left; }
.pill.change:hover { border-color: var(--line-strong); }
.pill.change small { color: var(--faint); font-family: var(--mono); font-size: 10.5px; font-weight: 500; }
.cell { display: flex; align-items: center; justify-content: center; padding: 8px 6px; z-index: 1; min-height: 96px; }
.cell.small { min-height: 54px; }
.node { width: 100%; max-width: 126px; min-height: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px 8px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line-strong); text-align: center; box-shadow: var(--shadow); }
.node .ico { color: var(--sub); margin-bottom: 2px; }
.node b { font-size: 12.5px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.node small { font-size: 11px; color: var(--faint); line-height: 1.25; }
.node.spectra { background: color-mix(in srgb, var(--accent-soft) 70%, var(--panel)); border-color: var(--accent-line); }
.node.spectra .ico { color: var(--accent); }
.node.cmd b { font-family: var(--mono); font-size: 11.5px; }
.node.current { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow-lg); cursor: pointer; }
.node.current .ico, .node.current small { color: color-mix(in srgb, var(--accent-ink) 80%, transparent); }
.node.done { min-height: 0; width: 34px; height: 34px; padding: 0; border-radius: 50%; background: var(--ok); border-color: var(--ok); color: #fff; }
.node.done .ico { color: #fff; margin: 0; }
.node.todo { min-height: 0; width: 14px; height: 14px; padding: 0; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--panel); box-shadow: none; }
.node.ghost { border-style: dashed; background: transparent; box-shadow: none; }
.node.clickable { cursor: pointer; } .node.clickable:hover { border-color: var(--accent); }
.flow svg.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
.links path { fill: none; stroke: var(--line-strong); stroke-width: 2; }
.links path.on { stroke: var(--accent); }
.links path.done { stroke: var(--ok); }
.links path.dash { stroke-dasharray: 5 5; }
.links text { font: 600 11px var(--font); fill: var(--accent); }
.lane-sep { grid-column: 1 / -1; height: 1px; background: var(--line); margin: 6px 0; z-index: 1; }
.lane-title { grid-column: 1 / -1; font-size: 11px; font-weight: 600; color: var(--faint); letter-spacing: .04em; padding: 10px 0 2px; z-index: 1; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; color: var(--sub); font-size: 12px; margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line-strong); background: var(--panel); display: inline-block; }

/* 樹狀（流程樹、規則書、任務） */
.tree { list-style: none; margin: 0; padding: 0; }
.tree ul { list-style: none; margin: 0; padding-left: 18px; border-left: 1px solid var(--line); margin-left: 9px; }
.tnode { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 7px; min-width: 0; }
.tnode.clickable { cursor: pointer; } .tnode.clickable:hover { background: var(--hover); }
.tnode.sel { background: var(--sel); }
.tw { width: 18px; height: 18px; flex: none; display: inline-flex; align-items: center; justify-content: center; border: 0; background: none; cursor: pointer; color: var(--faint); padding: 0; border-radius: 4px; transition: transform .12s; }
.tw:hover { background: var(--hover); }
.tw.leaf { visibility: hidden; }
li.closed > .tnode .tw { transform: rotate(-90deg); }
li.closed > ul { display: none; }
.tnode .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tnode .meta { margin-left: auto; display: flex; gap: 8px; align-items: center; flex: none; }
.ck { color: var(--ok); } .ck-no { color: var(--faint); }

/* 進度鏈（明細） */
.chain { display: flex; align-items: flex-start; margin: 14px 0 16px; }
.step { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: none; width: 46px; }
.dotc { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11.5px; border: 2px solid var(--line-strong); background: var(--panel); color: var(--faint); font-weight: 700; }
.step.done .dotc { background: var(--ok); border-color: var(--ok); color: #fff; }
.step.now .dotc { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 4px var(--accent-soft); }
.step span { font-size: 11px; color: var(--sub); white-space: nowrap; }
.link { flex: 1; height: 2px; background: var(--line-strong); margin-top: 12px; min-width: 4px; }
.link.done { background: var(--ok); }

/* 內容閱讀 */
.split { display: grid; grid-template-columns: 280px 1fr; gap: 16px; align-items: start; }
.flist { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.flist button { display: flex; gap: 10px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 10px 12px; cursor: pointer; align-items: flex-start; }
.flist button .ico { color: var(--faint); margin-top: 2px; }
.flist button:last-child { border-bottom: 0; }
.flist button:hover { background: var(--hover); } .flist button[aria-current="true"] { background: var(--sel); }
.flist button[aria-current="true"] b { color: var(--accent); }
.flist b { font-weight: 600; font-size: 13px; display: block; }
.flist small { display: block; color: var(--faint); font-size: 11.5px; overflow-wrap: anywhere; }
.doc { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px 28px; min-height: 320px; overflow-x: auto; }
.dochead { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.dochead .path { flex: 1; color: var(--faint); font-family: var(--mono); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.md { line-height: 1.75; overflow-wrap: anywhere; }
.md h1 { font-size: 22px; margin: 0 0 12px; letter-spacing: -.01em; } .md h2 { font-size: 17px; margin: 24px 0 8px; } .md h3 { font-size: 14.5px; margin: 18px 0 6px; color: var(--ink); }
.md table { border-collapse: collapse; margin: 12px 0; font-size: 13px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 6px 10px; vertical-align: top; }
.md th { background: var(--side); font-weight: 600; }
.md code { font-family: var(--mono); font-size: 12.5px; background: var(--hover); padding: 1px 5px; border-radius: 5px; }
.md pre { background: var(--side); border: 1px solid var(--line); padding: 12px; border-radius: 8px; overflow-x: auto; } .md pre code { background: none; padding: 0; }
.md blockquote { margin: 12px 0; padding: 8px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; color: var(--sub); }
.md img { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); }

/* 素材 */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; cursor: pointer; }
.tile:hover { border-color: var(--line-strong); }

.tile img { max-width: 100%; max-height: 100%; object-fit: contain; }
.tile p { margin: 0; padding: 8px 10px; font-size: 12px; overflow-wrap: anywhere; border-top: 1px solid var(--line); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.fbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; height: 28px; padding: 0 12px; cursor: pointer; font-size: 12.5px; font-weight: 500; color: var(--sub); }

.tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }

.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.pcard { cursor: pointer; } .pcard:hover { border-color: var(--line-strong); }
.pcard.cur { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ask { background: var(--warn-soft); border-radius: 8px; padding: 9px 12px; white-space: pre-line; margin: 8px 0; color: var(--ink); font-size: 13px; }
.pre { white-space: pre-line; }
.err { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.banner { display: flex; gap: 8px; align-items: flex-start; background: var(--accent-soft); color: var(--ink); border-radius: 8px; padding: 9px 12px; margin-bottom: 12px; font-size: 12.5px; }
.banner .ico { color: var(--accent); margin-top: 2px; }
.close { float: right; }
.scrim { display: none; }
[hidden] { display: none !important; }
.menu { position: absolute; top: 46px; min-width: 280px; max-width: calc(100vw - 16px); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; z-index: 60; }
.menu button { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.menu button:hover, .menu button[aria-current="true"] { background: var(--hover); }
.menu .mt { flex: 1; min-width: 0; } .menu b { display: block; font-weight: 600; } .menu small { display: block; color: var(--faint); font-size: 11.5px; font-family: var(--mono); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
dialog { border: 1px solid var(--line); border-radius: 16px; padding: 0; width: min(560px, calc(100vw - 32px)); background: var(--panel); color: var(--ink); box-shadow: var(--shadow-lg); }
dialog::backdrop { background: rgb(10 10 20 / .45); }
.dlg-h { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 15px; }
.dlg-b { padding: 16px 18px; max-height: 70vh; overflow-y: auto; }
.dlg-f { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--side); border-radius: 0 0 16px 16px; }
.fld { display: block; margin-bottom: 12px; }
.fld > span { display: block; font-weight: 600; margin-bottom: 5px; font-size: 12.5px; color: var(--sub); }
.fld input, .fld select, .fld textarea, .editor textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; }
.fld input:focus, .fld select:focus, .fld textarea:focus, .editor textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.fld textarea { min-height: 110px; resize: vertical; }

.steps { margin: 0 0 12px; padding-left: 20px; } .steps li { margin: 4px 0; }
#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 70; max-width: calc(100vw - 32px); box-shadow: var(--shadow-lg); }
#toast.show { opacity: 1; }
@media (max-width: 1100px) { .detail.open { position: fixed; inset: 52px 0 0 auto; width: min(100%, 560px); z-index: 20; box-shadow: var(--shadow-lg); } }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }

  .view { padding: 16px 14px 40px; }

  .fresh, .brand span, .proj .repo, .hide-sm { display: none !important; }
  .detail.open { inset: 52px 0 0 0; width: 100%; }
}
</style>
