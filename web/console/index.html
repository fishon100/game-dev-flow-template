<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>開發管理台</title>
<meta name="theme-color" content="#16151f">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../workbench/icon-180.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root {
  --bg: #f4f4f7; --panel: #ffffff; --side: #fbfbfd; --ink: #1b1a22; --sub: #5e5c6c; --faint: #8d8b9a; --line: #e4e3ea; --hover: #f0eff5; --sel: #ebe7ff;
  --accent: #5b3fd6; --accent-ink: #fff; --accent-soft: #efebff;
  --ok: #138a4b; --ok-soft: #e2f5ea; --warn: #a86400; --warn-soft: #fff2db; --bad: #c62828; --bad-soft: #fde8e8; --info: #1f6feb; --info-soft: #e6f0ff;
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  --radius: 10px; --shadow: 0 1px 2px rgb(20 10 60 / .05), 0 6px 24px rgb(20 10 60 / .06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111018; --panel: #1a1924; --side: #15141e; --ink: #ebeaf3; --sub: #a9a7ba; --faint: #7d7b8f; --line: #2b2a39; --hover: #222130; --sel: #2c2650;
  --accent: #9b85ff; --accent-ink: #15141e; --accent-soft: #29234a;
  --ok: #4cd391; --ok-soft: #16301f; --warn: #ffb547; --warn-soft: #362812; --bad: #ff7b7b; --bad-soft: #3a191c; --info: #7aa9ff; --info-soft: #172640; --shadow: none;
} }
:root[data-theme="dark"] {
  --bg: #111018; --panel: #1a1924; --side: #15141e; --ink: #ebeaf3; --sub: #a9a7ba; --faint: #7d7b8f; --line: #2b2a39; --hover: #222130; --sel: #2c2650;
  --accent: #9b85ff; --accent-ink: #15141e; --accent-soft: #29234a;
  --ok: #4cd391; --ok-soft: #16301f; --warn: #ffb547; --warn-soft: #362812; --bad: #ff7b7b; --bad-soft: #3a191c; --info: #7aa9ff; --info-soft: #172640; --shadow: none;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; -webkit-text-size-adjust: 100%; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 240px 1fr; grid-template-rows: 52px 1fr; height: 100vh; height: 100dvh; }
/* 上方列 */
.top { grid-column: 1 / -1; position: relative; z-index: 40; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; white-space: nowrap; }
.brand img { width: 22px; height: 22px; }
.proj { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--side); cursor: pointer; min-width: 0; max-width: 340px; }
.proj b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spacer { flex: 1; }
.fresh { color: var(--faint); font-size: 12px; white-space: nowrap; }
.ibtn { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 34px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; text-decoration: none; color: var(--ink); white-space: nowrap; }
.ibtn:hover { background: var(--hover); }
.menu-btn { display: none; }
/* 側欄 */
.side { background: var(--side); border-right: 1px solid var(--line); overflow-y: auto; padding: 10px 8px 24px; }
.side h6 { margin: 14px 10px 4px; font-size: 11px; letter-spacing: .06em; color: var(--faint); font-weight: 600; }
.nav { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 10px; border: 0; border-radius: 8px; background: none; cursor: pointer; text-align: left; color: var(--sub); }
.nav:hover { background: var(--hover); color: var(--ink); }
.nav[aria-current="page"] { background: var(--sel); color: var(--ink); font-weight: 600; }
.nav .ic { width: 18px; text-align: center; }
.nav .n { margin-left: auto; font-size: 12px; color: var(--faint); }
.nav .n.hot { color: #fff; background: var(--bad); border-radius: 99px; padding: 0 7px; }
/* 主區 */
.main { overflow: hidden; display: flex; min-width: 0; }
.view { flex: 1; overflow-y: auto; padding: 18px 22px 40px; min-width: 0; }
.detail { width: min(46%, 620px); border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 18px 22px 40px; display: none; }
.detail.open { display: block; }
.vh { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.vh h1 { font-size: 19px; margin: 0; }
.vh .sub { color: var(--faint); font-size: 13px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.kpi b { display: block; font-size: 24px; line-height: 1.2; }
.kpi span { color: var(--faint); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 14px; margin-top: 14px; }
h3 { font-size: 14px; margin: 0 0 10px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--hover); color: var(--sub); }
.s-待同意 { background: var(--warn-soft); color: var(--warn); }
.s-已同意, .s-實作中 { background: var(--info-soft); color: var(--info); }
.s-待結案 { background: var(--accent-soft); color: var(--accent); }
.s-已結案 { background: var(--ok-soft); color: var(--ok); }
.c-bad { background: var(--bad-soft); color: var(--bad); } .c-ok { background: var(--ok-soft); color: var(--ok); } .c-warn { background: var(--warn-soft); color: var(--warn); }
.muted { color: var(--faint); font-size: 13px; }
.bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; min-width: 60px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
/* 表格 */
table.t { width: 100%; border-collapse: collapse; }
.t th { text-align: left; font-size: 12px; color: var(--faint); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.t td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.t tr.click { cursor: pointer; } .t tr.click:hover td { background: var(--hover); } .t tr.sel td { background: var(--sel); }
.t th, .t td { min-width: 4.5em; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
/* 樹狀圖 */
.tree { list-style: none; margin: 0; padding: 0; }
.tree ul { list-style: none; margin: 0; padding-left: 20px; border-left: 1px dashed var(--line); margin-left: 9px; }
.node { display: flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 6px; cursor: default; min-width: 0; }
.node.clickable { cursor: pointer; } .node.clickable:hover { background: var(--hover); }
.node.sel { background: var(--sel); }
.tw { width: 16px; height: 16px; flex: none; display: inline-flex; align-items: center; justify-content: center; border: 0; background: none; cursor: pointer; color: var(--faint); padding: 0; transition: transform .12s; }
.tw.leaf { visibility: hidden; }
li.closed > .node .tw { transform: rotate(-90deg); }
li.closed > ul { display: none; }
.node .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node .meta { margin-left: auto; display: flex; gap: 6px; align-items: center; flex: none; }
.done-x { color: var(--ok); } .todo-x { color: var(--faint); }
/* 進度鏈 */
.chain { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin: 10px 0 14px; }
.step { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 44px; }
.dotc { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; border: 2px solid var(--line); background: var(--panel); color: var(--faint); font-weight: 700; }
.step.done .dotc { background: var(--ok); border-color: var(--ok); color: #fff; }
.step.now .dotc { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.step span { font-size: 11px; color: var(--sub); }
.link { flex: 1; min-width: 6px; height: 2px; background: var(--line); margin-bottom: 18px; }
.link.done { background: var(--ok); }
/* 流程管線（總覽） */
.pipe { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.stage { flex: 1; min-width: 110px; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; background: var(--panel); position: relative; cursor: pointer; }
.stage:hover { background: var(--hover); }
.stage b { font-size: 22px; display: block; }
.stage span { font-size: 12px; color: var(--faint); }
.stage::after { content: "›"; position: absolute; right: -9px; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: 18px; }
.stage:last-child::after { content: none; }
/* 內容閱讀 */
.split { display: grid; grid-template-columns: 280px 1fr; gap: 14px; align-items: start; }
.flist { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.flist button { display: flex; gap: 8px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 9px 12px; cursor: pointer; }
.flist button:last-child { border-bottom: 0; }
.flist button:hover { background: var(--hover); } .flist button[aria-current="true"] { background: var(--sel); font-weight: 600; }
.flist small { display: block; color: var(--faint); font-weight: 400; font-size: 12px; overflow-wrap: anywhere; }
.doc { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 24px; min-height: 300px; overflow-x: auto; }
.md { line-height: 1.75; overflow-wrap: anywhere; }
.md h1 { font-size: 22px; margin: 0 0 12px; } .md h2 { font-size: 18px; margin: 22px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); } .md h3 { font-size: 15px; margin: 16px 0 6px; }
.md table { border-collapse: collapse; margin: 10px 0; font-size: 13px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 9px; vertical-align: top; }
.md th { background: var(--hover); }
.md code { font-family: var(--mono); font-size: 12.5px; background: var(--hover); padding: 1px 5px; border-radius: 5px; }
.md pre { background: var(--hover); padding: 12px; border-radius: 8px; overflow-x: auto; } .md pre code { background: none; padding: 0; }
.md blockquote { margin: 10px 0; padding: 6px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; color: var(--sub); }
.md img { max-width: 100%; border-radius: 8px; }
/* 素材 */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; cursor: pointer; }
.tile .im { aspect-ratio: 4/3; background: repeating-conic-gradient(var(--hover) 0 25%, transparent 0 50%) 0 0/16px 16px; display: flex; align-items: center; justify-content: center; }
.tile img { max-width: 100%; max-height: 100%; object-fit: contain; }
.tile p { margin: 0; padding: 8px 10px; font-size: 12px; overflow-wrap: anywhere; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.fbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.fbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.search { width: 100%; max-width: 320px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); text-decoration: none; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: flex-start; }
.list li:first-child { border-top: 0; }
.list .g { flex: 1; min-width: 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--warn); }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
.ask { background: var(--warn-soft); border-radius: 8px; padding: 8px 12px; white-space: pre-line; margin: 8px 0; }
.pre { white-space: pre-line; }
.empty { color: var(--faint); padding: 16px 0; text-align: center; }
.close { float: right; }
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.pcard { cursor: pointer; } .pcard:hover { border-color: var(--accent); }
.pcard.cur { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.err { background: var(--bad-soft); color: var(--bad); }
.scrim { display: none; }
[hidden] { display: none !important; }
.menu { position: absolute; top: 48px; min-width: 260px; max-width: calc(100vw - 16px); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 40px rgb(0 0 0 / .18); padding: 6px; z-index: 60; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.menu button:hover, .menu button[aria-current="true"] { background: var(--hover); }
.menu small { display: block; color: var(--faint); font-size: 12px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 32px)); background: var(--panel); color: var(--ink); box-shadow: 0 20px 60px rgb(0 0 0 / .25); }
dialog::backdrop { background: rgb(10 8 20 / .45); }
.dlg-h { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 15px; }
.dlg-b { padding: 16px 18px; max-height: 70vh; overflow-y: auto; }
.dlg-f { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); }
.fld { display: block; margin-bottom: 12px; }
.fld > span { display: block; font-weight: 600; margin-bottom: 4px; font-size: 13px; }
.fld input, .fld select, .fld textarea, .editor textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--side); color: var(--ink); font: inherit; }
.fld textarea { min-height: 110px; resize: vertical; }
.editor textarea { min-height: 55vh; font-family: var(--mono); font-size: 13px; line-height: 1.6; resize: vertical; }
.steps { margin: 0 0 12px; padding-left: 20px; } .steps li { margin: 4px 0; }
.who { display: inline-flex; align-items: center; gap: 6px; } .who img { width: 22px; height: 22px; border-radius: 50%; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; max-width: calc(100vw - 32px); }
#toast.show { opacity: 1; }
.banner { background: var(--info-soft); color: var(--info); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; font-size: 13px; }
@media (max-width: 1100px) { .detail.open { position: fixed; inset: 52px 0 0 auto; width: min(100%, 560px); z-index: 20; box-shadow: -10px 0 30px rgb(0 0 0 / .2); } }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .menu-btn { display: inline-flex; }
  .side { position: fixed; top: 52px; bottom: 0; left: 0; width: 260px; z-index: 30; transform: translateX(-100%); transition: transform .18s; }
  body.drawer .side { transform: none; }
  body.drawer .scrim { display: block; position: fixed; inset: 52px 0 0 0; background: rgb(0 0 0 / .35); z-index: 25; }
  .view { padding: 14px 14px 40px; }
  .split { grid-template-columns: 1fr; }
  .fresh, .brand span { display: none; }
  .detail.open { inset: 52px 0 0 0; width: 100%; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="ibtn menu-btn" id="menu" aria-label="選單">☰</button>
    <div class="brand"><img src="icon.svg" alt=""><span>開發管理台</span></div>
    <button class="proj" id="projBtn" title="切換專案" aria-haspopup="menu" aria-expanded="false"><span>📁</span><b id="projName">讀取中…</b><span class="muted">▾</span></button>
    <div class="spacer"></div>
    <span class="fresh" id="fresh"></span>
    <button class="ibtn" id="reload" title="重新整理">⟳</button>
    <button class="ibtn" id="theme" title="切換深淺色">◐</button>
    <a class="ibtn" id="toWorkbench" title="手機版工作台" target="_blank" rel="noopener">📱</a>
    <button class="ibtn" id="loginBtn" title="登入後可以在管理台直接同意、留言、寫回饋、編輯內容">🔑 登入</button>
  </header>
  <nav class="side" id="side" aria-label="功能選單"></nav>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <section class="view" id="view"><div class="card">讀取中…</div></section>
    <aside class="detail" id="detail" aria-label="明細"></aside>
  </main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js?v=202610060126"></script>
</body>
</html>
