# 工作台：同意勾選 → tasks.md、自動開／關申請單 Issue、更新工作台資料（workbench-data 分支）
# 觸發：推上 main、Issue 有變動（開、改、標籤、關）、手動、每小時一次（保險）
name: workbench

on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, labeled, closed, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: workbench
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 同步申請單與工作台資料
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/workbench/sync.mjs
      - name: 記錄企劃同意（tasks.md 0.1）
        run: |
          if [ -s workbench-out/changed.txt ]; then
            git config user.name "workbench-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $(cat workbench-out/changed.txt)
            git commit -m "企劃同意：$(basename $(dirname $(head -n1 workbench-out/changed.txt)))（來自 GitHub Issue）"
            git push
          fi
      - name: 發布工作台資料
        run: |
          cd workbench-out
          git init -q -b workbench-data
          git config user.name "workbench-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -q -m "工作台資料 $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" workbench-data
