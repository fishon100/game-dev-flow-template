# AI 幫手：在任何 Issue（提案、回饋、需求）或 PR 留言 @claude，AI 就在 GitHub 上工作
#   提案 Issue：「@claude 開工」→ 照提案做（企劃要先同意），做完開 PR 給程式審查
#   回饋／需求 Issue：「@claude 寫成提案」→ 寫提案，推上去後自動開提案 Issue 等企劃同意
#   PR：「@claude 修…」→ 照審查意見修改
# 管理台的「交給 AI」按鈕就是幫你留這則言。
# 要先設定（一次）：repo Settings → Secrets → Actions 加 ANTHROPIC_API_KEY（或 CLAUDE_CODE_OAUTH_TOKEN），
# 並在 https://github.com/apps/claude 把 Claude App 裝到這個 repo。沒設定時會留言提醒，不會出錯。
name: ai

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: ai-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # 只有留言裡有 @claude、而且不是機器人自己留的才跑（AI 套件也會檢查留言的人有沒有寫入權限）
    if: contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 檢查 AI 設定
        id: key
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          echo "ok=$HAS_KEY" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEY" != "true" ]; then
            gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" --body "🤖 AI 還沒設定，所以這次沒有開始做。請程式照 docs/flow/08 的「交給 AI（GitHub 上）」設定金鑰與 Claude App；設定好之前，請在電腦上對 Claude 說要做什麼。"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
        with:
          fetch-depth: 20

      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 22

      # Spectra 的 /spectra-* 指令不放在 repo 裡（授權不允許轉散布），每次在這裡產生
      - name: 準備 Spectra 指令
        if: steps.key.outputs.ok == 'true'
        continue-on-error: true
        run: npm install -g @kaochenlong/spxa && spxa update

      - name: AI 工作
        if: steps.key.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 80
            --allowedTools "Bash(node *),Bash(npm *),Bash(npx *),Bash(spxa *),Bash(git *),Bash(gh issue *),Bash(gh pr *),Edit,Write,Read,Glob,Grep"
            --append-system-prompt "你在 GitHub Actions 上被 @claude 呼叫。照 CLAUDE.md 的「在 GitHub 上被 @claude 呼叫時」一節做，回覆一律用白話繁體中文。"
