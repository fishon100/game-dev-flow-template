schema: spec-driven

# 給 AI 寫提案時看的專案背景。開新專案時把 <...> 換成你的遊戲。
context: |
  Game: <遊戲名稱> — <一句話玩法>.
  Tech: plain JavaScript (ES modules) + canvas in web/js; pure game rules live in web/js/rules.js so Node can test them.
  Tests: `node --test` (tests/*.test.mjs, runs in CI before every deploy) + web/test.html (browser-only checks).
  Tuning numbers live only in web/tuning.json; never hard-code them.
  Difficulty MUST be measured with human-like bots (reaction time + timing/aim error), never machine reaction speed.
  Readers are game planners who are new to programming: write proposal, design and tasks in plain Traditional Chinese,
  avoid jargon, and explain every rule with a concrete in-game example.
  # ↓ 以下抄自主架構規劃書；規劃書改了這裡要跟著改（對 AI 說「把主架構規劃書的核心規則抄進 config」）
  One-liner (一句話): <主架構規劃書的一句話>
  Design pillars (設計支柱，every proposal must serve at least one):
    <支柱>｜<意思>
  Core loop: <核心循環>
  Hard rules from the planner (核心規則，不能改):
    1. <核心規則>

rules:
  proposal:
    - 第一行固定寫「> 中文標題：<一句話，15 字內>」（工作台、GitHub Issue、Notion 都用這個標題）
    - 第二行固定寫「> 類型：企劃」或「> 類型：技術」。企劃＝玩家看得到的改變（玩法、畫面、數值、文字），由企劃同意；技術＝玩家看不到的改變（重構、效能、工具、測試、建置），由程式同意。會新增或修改規則書（specs）的一律是「企劃」；拿不準就寫「企劃」
    - 接著寫企劃的文件：「> 企劃書：<docs/企劃/企劃書/ 裡的路徑>」；會直接改變使用者看到的畫面（介面向）再加「> 文件：介面向」與「> 示意圖：<docs/企劃/示意圖/ 裡的 html 路徑>」（好幾個用「、」分開）。只動後端邏輯、資料的（系統向）不用寫「文件」與「示意圖」
    - 有企劃書時，Why／What 寫摘要並引用企劃書的章節，不整份重抄；企劃書與示意圖不一致的地方（企劃書有、畫面沒有，或畫面有、企劃書沒寫）逐條列在「需要確認的事」
    - 「Why」用企劃看得懂的話寫：玩家遇到什麼問題、這次要解決什麼
    - 最後一節固定是「## 需要企劃確認的事」（技術提案寫「## 需要程式確認的事」）：數值、文字、取捨條列出來（沒有就寫「無」）
    - 有拿掉或改變玩家已經習慣的東西時，標 **BREAKING** 並說明影響
    - 「需要確認的事」前面加一節「## 試玩重點」：2～5 項，寫試玩的人（QA／企劃）看得出來的事（例：「第 3 關開始，瞄準時看不到預測線」），不寫程式細節。做完上線後會變成試玩清單。技術提案寫「確認沒壞掉的地方」
    - 「Why」寫出這張提案服務哪一個設計支柱；會碰到核心規則的，在「需要企劃確認的事」第一條寫「⚠️ 會改到核心規則第 N 條：…」，企劃沒同意前不能做
  specs:
    - 每條規則下面至少一個「情境：當…，則…」，之後會一對一變成自動測試
    - 規則後面附一行中文說明（> 中文：…）
  tasks:
    - 第一組固定是「## 0. 企劃確認」，只有一項：「- [ ] 0.1 企劃確認：讀過 proposal 的為什麼、改什麼、需要企劃確認的事，同意開始實作」（企劃可在工作台／GitHub Issue、Notion、Spectra 桌面版同意，或在對話中說「同意」）。AI 不可以自己決定同意：只有企劃在對話中明確說「同意」或 Notion 卡片是「同意」時才由 AI 勾，並在後面註明「（企劃於對話中／Notion 同意，日期）」；GitHub Issue 的勾選由 workbench Action 自動寫回
    - 技術提案的 0.1 改成「- [ ] 0.1 程式確認：讀過 proposal，同意開始實作」，同意的人是程式（規則同上：AI 不可以自己勾，只有程式在 Issue 勾「程式同意」、在管理台按同意，或在對話中明確說同意；還沒有程式的團隊，企劃可以代為同意並註明「（企劃代程式同意，日期）」）
    - 技術提案在分支 tech/<提案名> 上做；「跑全部測試」之後加一項「開 PR 給程式審查」（PR 內文附提案連結與測試結果），程式審查並合併後才做「部署並通知」
    - 介面向的提案：0.1 是「需求＋示意圖確認」（需求會議看企劃書和示意圖）。美術的任務之後加一個確認點「- [ ] 0.2 【企劃】規格確認：讀過規格書（示意圖上的元件標註＋規則書的元件規則），同意開始寫前端」；0.2 前面一項是「依示意圖與美術稿寫規格書」（企劃通常等美術完成約 9 成才要規格書，避免重工）。0.2 沒勾之前不寫前端程式
    - 需要人做的任務，開頭標上負責的角色：【企劃】【美術】【劇本】【數值】【程式】（例：「- [ ] 2.3 【美術】畫 Boss 第二階段立繪」）；AI 自己做的任務不用標。管理台會把這些任務放進該角色的「我的待辦」
    - 實作的第一個任務一定是「先寫會失敗的測試」（TDD）
    - 最後兩個任務固定是「跑全部測試」與「部署並通知」
